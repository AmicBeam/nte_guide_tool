{% extends 'common/base.html' %}
{% block title %}构筑{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('card_game_module.static', filename='css/v2_common.css') }}">
<link rel="stylesheet" href="{{ url_for('card_game_module.static', filename='css/v2_build.css') }}">
{% endblock %}
{% block body %}
<main class="v2-page v2-build-page">
    <section class="glass-card panel-header v2-build-command">
        <div>
            <p class="eyebrow">四人构筑</p>
            <h1>出战构筑</h1>
            <p class="subtle">每人从八种角色卡中携带 8 张，同名最多 2 张，全队共 32 张。</p>
        </div>
        <div class="header-actions">
            <a class="secondary-btn" href="{{ url_for('main.card_game_home') }}">返回</a>
            <button class="secondary-btn" id="v2-reset-starter-btn" type="button">重置预组</button>
            <button class="primary-btn" id="v2-save-build-btn" type="button">保存构筑</button>
        </div>
    </section>
    <section class="glass-card v2-banner" id="v2-build-banner" hidden></section>
    <section class="glass-card v2-build-summary-bar">
        <p id="v2-build-total">总牌数 0 / 32</p>
        <p id="v2-build-source">尚未读取构筑。</p>
    </section>
    <section class="v2-build-groups" id="v2-build-groups" aria-label="四人卡组">
        <article class="glass-card v2-build-group" data-character-id="nanali"><div class="v2-skel"></div></article>
        <article class="glass-card v2-build-group" data-character-id="zero"><div class="v2-skel"></div></article>
        <article class="glass-card v2-build-group" data-character-id="jiuyuan"><div class="v2-skel"></div></article>
        <article class="glass-card v2-build-group" data-character-id="xun"><div class="v2-skel"></div></article>
    </section>
    <aside class="v2-detail-layer" id="v2-build-detail" aria-hidden="true"></aside>
</main>
<script src="{{ url_for('static', filename='common/js/common.js') }}"></script>
<script src="{{ url_for('card_game_module.static', filename='js/v2_api.js') }}"></script>
<script src="{{ url_for('card_game_module.static', filename='js/v2_build.js') }}"></script>
{% endblock %}
