<dialog id="sync-dialog" aria-labelledby="sync-title"><form id="sync-form"><div class="sync-heading"><h2 id="sync-title">同步塔吉多游戏数据</h2><button type="button" id="sync-close" aria-label="关闭同步窗口">×</button></div><p>仅保存角色当前练度与已装备的弧盘、空幕卡带等资料，供账号练度查看与养成计算使用。手机号、验证码和游戏登录凭据不写入数据库。</p>
<label>手机号<input id="sync-mobile" type="tel" autocomplete="tel" inputmode="numeric" maxlength="11" required></label><div class="sync-code"><label>短信验证码<input id="sync-code" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="8"></label><button id="sms-send" type="button">获取验证码</button></div>
<label id="sync-role-label" hidden>选择游戏账号<select id="sync-role"></select></label><button type="button" id="sync-reset">更换手机号 / 重新验证</button><p id="sync-status" role="status"></p><button id="sync-submit" type="submit">验证并同步</button></form></dialog>
